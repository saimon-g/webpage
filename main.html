<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No internet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --text: #202124;
      --muted: #5f6368;
      --link: #1a73e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --link: #8ab4f8;
      }
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
    }
    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 15vh 20px 40px;
    }
    .icon { font-size: 4rem; line-height: 1; color: var(--muted); }
    h1 { font-size: 1.6rem; font-weight: 500; margin: 1.5rem 0 0.75rem; }
    ul { color: var(--muted); padding-left: 1.5rem; margin: 0.5rem 0 1.5rem; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h2 {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--muted);
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon">:(</div>
    <h1>No internet</h1>
    <p>Try:</p>
    <ul>
      <li>Checking the network cables, modem, and router</li>
      <li>Reconnecting to Wi-Fi</li>
      <li>Closing a few of your 47 open tabs</li>
    </ul>
    <h2>
      ERR_BROWSER_TOO_SLOW<br>
      <a href="dino/index.html">Play Dino instead!</a>
    </h2>
  </main>
</body>
</html>
